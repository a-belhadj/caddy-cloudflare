name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # weekly: picks up Go/Alpine fixes

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/caddy-cloudflare

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # badges branch
      packages: write
      security-events: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Scheduled runs bypass the cache, otherwise `apk upgrade` / builder layers would never refresh.
      - name: Build (amd64, local) for scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: caddy-cf:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Caddy version
        id: ver
        run: |
          v=$(docker run --rm caddy-cf:scan caddy version | awk '{print substr($1,2)}')
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version: $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Never blocks: the image is Caddy + the Cloudflare plugin, Go deps are whatever Caddy pins.
      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: caddy-cf:scan
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy.sarif
          limit-severities-for-sarif: true

      - name: Trivy scan (JSON)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: caddy-cf:scan
          severity: HIGH,CRITICAL
          format: json
          output: trivy.json
          skip-setup-trivy: true

      # Reference: the official image this one is built from (`FROM caddy:2`).
      - name: Pull official caddy:2
        run: docker pull caddy:2

      - name: Trivy scan official image (JSON)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: caddy:2
          severity: HIGH,CRITICAL
          format: json
          output: trivy-official.json
          skip-setup-trivy: true

      - name: Publish CVE report and badge data
        run: |
          ids() { jq -r '[.Results[]?.Vulnerabilities[]?.VulnerabilityID] | unique[]' "$1"; }
          count() { jq --arg s "$2" '[.Results[]?.Vulnerabilities[]? | select(.Severity == $s) | .VulnerabilityID] | unique | length' "$1"; }
          oc=$(count trivy-official.json CRITICAL); oh=$(count trivy-official.json HIGH)
          mc=$(count trivy.json CRITICAL);          mh=$(count trivy.json HIGH)
          added=$(comm -13 <(ids trivy-official.json) <(ids trivy.json))
          {
            echo '## CVE: official `caddy:2` vs this image (HIGH/CRITICAL)'
            echo '| | official `caddy:2` | this image |'
            echo '|---|---|---|'
            echo "| CRITICAL | $oc | $mc |"
            echo "| HIGH | $oh | $mh |"
            echo
            echo "**CVE added by this image vs official:** ${added:-none}"
            echo
            echo '<details><summary>Official caddy:2</summary>'; echo; echo '```'; trivy convert --format table trivy-official.json; echo '```'; echo '</details>'
            echo
            echo '<details open><summary>This image</summary>'; echo; echo '```'; trivy convert --format table trivy.json; echo '```'; echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          jq -n --argjson o "$((oc+oh))" --argjson m "$((mc+mh))" --argjson mc "$mc" \
            '{schemaVersion: 1, label: "CVE official → this image", message: "\($o) → \($m)",
              color: (if $m == 0 then "brightgreen" elif $mc > 0 or $m > $o then "red" else "orange" end)}' > badge.json
          cat badge.json

      # Orphan branch, force-pushed: keeps main free of generated commits.
      - name: Publish CVE badge
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d=$(mktemp -d); cp badge.json "$d"; cd "$d"
          git init -q -b badges
          git add badge.json
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "CVE badge"
          git push -f "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}" badges

      - name: Generate SBOM (CycloneDX)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: caddy-cf:scan
          format: cyclonedx
          output: sbom.cdx.json
          skip-setup-trivy: true

      - name: Upload SARIF
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy.sarif

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ steps.ver.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ver.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.ver.outputs.version }}
            type=sha

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reached only if the scan passed.
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      - name: Upload SBOM artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
